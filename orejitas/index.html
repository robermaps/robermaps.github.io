<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orejitas · Sonidos para bebés</title>
  <meta name="description" content="Sonidos de animales, naturaleza, ruido blanco, transportes, juguetes, música y nanas para estimular a bebés y niños pequeños. Gratis, sin anuncios y sin conexión. Sounds for babies in Spanish and English.">
  <meta name="author" content="Roberto Jiménez">
  <meta name="theme-color" content="#FFF4DE">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Orejitas · Sonidos para bebés">
  <meta property="og:description" content="Animales, naturaleza, ruido blanco, transportes, juguetes, música y nanas. Gratis, sin anuncios y sin conexión.">
  <meta property="og:image" content="https://robermaps.github.io/orejitas/icons/og.png">
  <meta property="og:url" content="https://robermaps.github.io/orejitas/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>

<body data-cat="farm">
  <div class="sky" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="./" aria-label="Orejitas">
      <img class="brand-logo" src="icons/icon.svg" alt="" width="40" height="40">
      <span class="brand-text">
        <span class="brand-name" data-i18n="app">Orejitas</span>
        <span class="brand-tag" data-i18n="tagline">Sonidos para bebés y peques</span>
      </span>
    </a>
    <div class="controls">
      <button id="voiceBtn" class="icon-btn" type="button" aria-pressed="true" hidden>
        <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6c-.6.5-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/><circle cx="8.5" cy="9.5" r="1.3" fill="var(--btn-bg)"/><circle cx="12" cy="9.5" r="1.3" fill="var(--btn-bg)"/><circle cx="15.5" cy="9.5" r="1.3" fill="var(--btn-bg)"/></svg>
        <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6c-.6.5-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Idioma" data-i18n-aria="language">
        <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="cats-wrap" aria-label="Categorías" data-i18n-aria="categories">
    <div class="cats-inner"><div class="cats" id="cats" role="tablist"></div></div>
  </nav>

  <main class="main">
    <h1 class="sr-only" id="catTitle">Granja</h1>
    <div class="grid" id="grid" role="tabpanel" aria-labelledby="catTitle"></div>
    <p class="hint" id="hint" hidden></p>
  </main>

  <footer class="foot">
    <p><span data-i18n="footer">Hecho con cariño por</span> <a href="../">@robermaps</a></p>
    <p data-i18n="footerNote">Sin anuncios · Funciona sin conexión</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="player" id="player" hidden>
    <span class="player-emoji" id="playerEmoji" aria-hidden="true"></span>
    <span class="player-info">
      <span class="player-name" id="playerName"></span>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </span>
    <button class="timer-btn" id="timerBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4.3a7 7 0 0 0 10.5 10.2z" fill="currentColor"/></svg>
      <span id="timerLabel">∞</span>
    </button>
    <button class="stop-btn" id="stopBtn" type="button" aria-label="Parar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
    </button>
  </div>

  <noscript><p class="noscript">Orejitas necesita JavaScript para generar los sonidos. · Little Ears needs JavaScript to make sounds.</p></noscript>
</body>
</html>
